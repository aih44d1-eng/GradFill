<!doctype html><html class="oj-agent-os-windows oj-agent-browser-chrome"><head><meta charset="utf-8"><style>
body{font-family:Arial;margin:20px}label{display:inline-block;width:30%;margin:8px}input{width:30%;padding:6px}
</style></head><body>
<!--
  Proves two things confirmed live against Westpac's and South Lanarkshire
  Council's real Oracle Fusion Cloud Recruiting apply forms this session,
  neither of which the pre-existing test fixtures cover:

  1. GF.resolveATS()'s Oracle fingerprint fallback -- this page is served
     from a plain 127.0.0.1 origin (no oraclecloud.com hostname at all,
     the vanity-proxied case Oracle's own docs describe as standard), and
     carries only the two DOM markers real Oracle Fusion Recruiting pages
     load regardless of their own domain: an "oj-hcm-ce" script src from
     static.oracle.com (see <html> above for the matching oj- prefixed
     class -- Oracle Fusion applies these to <html>, not <body>) and the
     script bundle path itself.

  2. content.js's new aria-hidden="true" honeypot skip -- Westpac's real
     apply/email step has a field literally named "honey-pot-1", labelled
     "honeypot", sized 199x38px (NOT zero-size, so the pre-existing
     width/height filter alone would not have caught it), hidden only via
     aria-hidden="true" + tabindex="-1". This fixture reproduces that
     shape exactly. If the fix works, GF_FILL's report must never mention
     the honeypot field, and its value must stay empty.
-->
<script src="https://static.oracle.com/cdn/fa/oj-hcm-ce/2604.20.261590626/js/main-minimal.js" onerror="void 0"></script>
<h1>Oracle Fusion Cloud Recruiting fixture</h1>
<label>Email Address <input id="primary-email-0" name="primary-email-0" type="email" autocomplete="email"></label>
<label aria-hidden="true">honeypot <input id="honey-pot-1" name="honey-pot" type="text" tabindex="-1" aria-hidden="true"></label>
<script>
window.chrome={runtime:{onMessage:{addListener:function(fn){window.gfListener=fn}},sendMessage:function(){return Promise.resolve({ok:true})}}};
</script>
<script src="rules.js"></script><script src="content.js"></script>
<script>
const profile={personal:{firstName:'Test',lastName:'User',email:'t@example.com',country:'Australia'},eligibility:{},education:[],experience:[],languages:[],skills:[],preferences:{},tags:{industries:{items:[]},programs:{items:[]},leadership:{items:[]},extracurricular:{items:[]}},custom:[],fieldMemory:[],answerLibrary:[]};
setTimeout(()=>{
  const resolvedATS = (typeof GF!=='undefined' && GF.resolveATS) ? GF.resolveATS() : {key:'error'};
  document.body.setAttribute('data-resolved-ats', JSON.stringify(resolvedATS));
  gfListener({type:'GF_FILL',profile,roleContext:{}},{},function(res){
    document.body.setAttribute('data-done','yes');
    document.body.setAttribute('data-report',JSON.stringify(res.report||[]));
    document.body.setAttribute('data-honeypot-value', document.getElementById('honey-pot-1').value);
    document.body.setAttribute('data-honeypot-in-report', String((res.report||[]).some(r => /honey/i.test(JSON.stringify(r)))));
  });
},50);
</script>
</body></html>
