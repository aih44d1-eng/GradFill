<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial;margin:20px}.hdr{padding:18px;background:#9aacC5;margin-top:2px;cursor:pointer}.body{padding:16px;border:1px solid #ddd}label{display:inline-block;width:30%;margin:8px}input,select{width:100%;padding:6px}.hidden{display:none}
</style></head><body>
<h1>SuccessFactors one-click regression fixture</h1>
<div id="workHdr" class="hdr" onclick="toggle('workBody')">Work Experience</div>
<div id="workBody" class="body hidden"><button id="addWork">Add</button><div id="workRows"></div></div>
<div id="eduHdr" class="hdr" onclick="toggle('eduBody')">Education</div>
<div id="eduBody" class="body hidden"><button id="addEdu">Add</button><div id="eduRows"></div></div>
<div id="langHdr" class="hdr" onclick="toggle('langBody')">Language Skills</div>
<div id="langBody" class="body hidden"><p id="langEmpty">There are no items in this section.</p><button id="addLang">Add</button><div id="langRows"></div></div>
<script>
function toggle(id){document.getElementById(id).classList.toggle('hidden')}
function inp(label,id,ph){const l=document.createElement('label');l.textContent=label+' ';const i=document.createElement('input');i.id=id;i.name=id;i.setAttribute('data-field-id',id);if(ph)i.placeholder=ph;l.appendChild(i);return l}
function sel(label,id,opts){const l=document.createElement('label');l.textContent=label+' ';const s=document.createElement('select');s.id=id;s.name=id;s.setAttribute('data-field-id',id);s.innerHTML='<option>No Selection</option>'+opts.map(x=>'<option>'+x+'</option>').join('');l.appendChild(s);return l}
addWork.onclick=()=>{addWork.remove();const r=document.createElement('div');r.id='outsideWorkExperience_1';r.append(inp('Employer','outsideWorkExperience_1_employer'));r.append(sel('Type of Business','outsideWorkExperience_1_businessType',['Information Technology','Banking','Retail']));r.append(inp('Job Title','outsideWorkExperience_1_startTitle'));r.append(inp('Start Date','outsideWorkExperience_1_startDate','MM/DD/YYYY'));r.append(inp('End Date','outsideWorkExperience_1_endDate','MM/DD/YYYY'));r.append(sel('Location','outsideWorkExperience_1_location',['Australia','United Arab Emirates','United Kingdom']));workRows.append(r)};
addEdu.onclick=()=>{addEdu.remove();const r=document.createElement('div');r.id='formalEducation_1';r.append(sel('Type of Education','formalEducation_1_educationType',['Academic','Vocational','School']));r.append(sel('Type of School / Academic Institution','formalEducation_1_institutionType',['University','Vocational Institution','School']));r.append(sel('Main Area of Education','formalEducation_1_mainArea',['Information Technology','Computer Science','Business']));r.append(inp('Exact name of major','formalEducation_1_major'));r.append(inp('Start Date','formalEducation_1_startDate','MM/DD/YYYY'));r.append(inp('End Date','formalEducation_1_endDate','MM/DD/YYYY'));r.append(sel('Degree','formalEducation_1_degree',['Bachelor Degree','Master Degree']));r.append(inp('Grade','formalEducation_1_grade'));r.append(inp('Institution Name','formalEducation_1_schoolName'));r.append(sel('Institution Country','formalEducation_1_country',['Australia','United Arab Emirates','United Kingdom']));eduRows.append(r)};
addLang.onclick=()=>{addLang.remove();langEmpty.remove();const r=document.createElement('div');r.id='languageSkills_1';r.append(sel('Language','languageSkills_1_language',['English','Arabic','Urdu']));r.append(sel('Speaking Proficiency','languageSkills_1_speakingProf',['Native','Fluent','Conversational']));r.append(sel('Writing Proficiency','languageSkills_1_writingProf',['Native','Fluent','Conversational']));r.append(sel('Reading Proficiency','languageSkills_1_readingProf',['Native','Fluent','Conversational']));langRows.append(r)};
window.chrome={runtime:{onMessage:{addListener:function(fn){window.gfListener=fn}},sendMessage:function(){return Promise.resolve({ok:true})}}};
</script>
<script src="rules.js"></script><script src="content.js"></script>
<script>
const profile={personal:{firstName:'Test',lastName:'User',email:'t@example.com',country:'Australia'},eligibility:{},education:[{institution:'UTS',degree:'Bachelor of Cybersecurity',major:'Cybersecurity',levelLabel:'Bachelor Degree',educationType:'Academic',institutionType:'University',location:'Sydney, NSW',country:'Australia',wam:'73.89',startDate:'2023-02',expectedGraduation:'2026-11',completed:false}],experience:[{employer:'Gridware',businessType:'Consulting',title:'Cyber Security Intern',startDate:'2025-02',endDate:'2025-06',current:false,location:'Sydney, NSW',country:'Australia',description:'Cybersecurity consulting internship'}],languages:[{language:'English',spoken:'Native',written:'Native',reading:'Native'},{language:'Urdu',spoken:'Fluent',written:'Fluent',reading:'Fluent'}],skills:[],preferences:{},tags:{industries:{items:[]},programs:{items:[]},leadership:{items:[]},extracurricular:{items:[]}},custom:[],fieldMemory:[],answerLibrary:[]};
setTimeout(()=>gfListener({type:'GF_FILL',profile,roleContext:{}},{},function(res){document.body.setAttribute('data-done','yes');document.body.setAttribute('data-report',JSON.stringify(res.report||[]));}),50);
</script>
</body></html>
