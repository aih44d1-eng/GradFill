<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial;margin:20px}.hdr{padding:18px;background:#9aacC5}label{display:inline-block;width:30%;margin:8px}input{width:30%;padding:6px}
</style></head><body>
<!--
  Proves the Title/Qualification-Type/Institute matching against the EXACT
  real DOM shapes found live on CSIRO's SuccessFactors Candidate Profile
  (a different company from EY, checked specifically to see whether the
  EY-confirmed fixes generalise) -- captured via devtools against the real
  page (career10.successfactors.com, company=CSIRO), not guessed:
    - Previous Employment: label "Position Title", id="316:_txtFld",
      name="VFLD3" -- same SF Career Site Builder generated-id family as
      EY's bare "Title" field, but CSIRO's own label text already
      disambiguates it ("Position Title"), so this exercises the ordinary
      title rule, not the bare-label dead-anchor fix specifically.
    - Education "Qualification Type": role="combobox",
      aria-label="Qualification Type", id="283:_input" -- CSIRO's own
      wording for what EY called bare "Degree". This is a DIFFERENT rule
      (the dedicated `qualificationType` key) from EY's bareLabelIs-gated
      "degree" rule, not a re-exercise of the same fix -- worth keeping
      distinct rather than claiming one confirms the other.
    - Education "Educational Institute": role="combobox",
      aria-label="Educational Institute", id="290:_input" -- THIS is where
      CSIRO's real data found a genuine, previously-unknown gap: the old
      `institution` rules only recognised the word "institution", never
      "institute" (different words, not typo-equivalent), so this field
      matched nothing and would have been left blank on a real
      application. Fixed in this same pass -- see rules.js.
-->
<div class="hdr">Previous Employment</div>
<label for="320:_txtFld">Employer</label><input id="320:_txtFld" name="VFLD1">
<label for="316:_txtFld">Position Title</label><input id="316:_txtFld" name="VFLD3">

<div class="hdr">Education</div>
<label for="283:_input">Qualification Type</label>
<input id="283:_input" aria-label="Qualification Type" autocomplete="off" type="text" placeholder="No Selection" title="Qualification Type" role="combobox">
<label for="290:_input">Educational Institute</label>
<input id="290:_input" aria-label="Educational Institute" autocomplete="off" type="text" placeholder="No Selection" title="Educational Institute" role="combobox">
<script>
window.chrome={runtime:{onMessage:{addListener:function(fn){window.gfListener=fn}},sendMessage:function(){return Promise.resolve({ok:true})}}};
</script>
<script src="rules.js"></script><script src="content.js"></script>
<script>
const profile={personal:{firstName:'Test',lastName:'User',email:'t@example.com',country:'Australia'},eligibility:{},education:[{institution:'UTS',degree:'Bachelor of Cybersecurity',major:'Cybersecurity',levelLabel:'Bachelor Degree',startDate:'2023-02',expectedGraduation:'2026-11',completed:false}],experience:[{employer:'Gridware',title:'Cyber Security Intern',startDate:'2025-02',endDate:'2025-06',current:false,location:'Sydney, NSW',country:'Australia',description:''}],languages:[],skills:[],preferences:{},tags:{industries:{items:[]},programs:{items:[]},leadership:{items:[]},extracurricular:{items:[]}},custom:[],fieldMemory:[],answerLibrary:[]};
setTimeout(()=>{
  gfListener({type:'GF_FILL',profile,roleContext:{}},{},function(res){
    document.body.setAttribute('data-done','yes');
    document.body.setAttribute('data-report',JSON.stringify(res.report||[]));
    document.body.setAttribute('data-title-value', document.getElementById('316:_txtFld').value);
    document.body.setAttribute('data-qualtype-value', document.getElementById('283:_input').value);
    document.body.setAttribute('data-institute-value', document.getElementById('290:_input').value);
  });
},50);
</script>
</body></html>
