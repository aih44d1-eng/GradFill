<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial;margin:20px}.hdr{padding:18px;background:#9aacC5;margin-top:2px;cursor:pointer}.body{padding:16px;border:1px solid #ddd}label{display:inline-block;width:30%;margin:8px}input,select{width:100%;padding:6px}.hidden{display:none}
</style></head><body class="coreCSB job-page body">
<!--
  Proves GF.resolveATS()'s DOM-fingerprint fallback, not just the existing
  native-successfactors.com-hostname path. This file is opened from file://
  or a plain localhost origin -- location.hostname never matches
  *.successfactors.com/.eu or *.sapsf.com, exactly like the real vanity
  domains confirmed live this session (careers.ey.com, jobs.csiro.au,
  careers.anz.com, careers.bhp.com). The <img> below and the "coreCSB" body
  class are the two fingerprint signals GF.resolveATS() checks for --
  both were confirmed present on those real, live SuccessFactors Career
  Site Builder pages this session; this fixture doesn't invent them.

  Two things this fixture specifically exercises that the original
  successfactors-test.html does not:
  1. Detection with NO successfactors.com hostname at all (fingerprint-only).
  2. The SF-specific MM/DD/YYYY day-inference branch in formatDate()/
     dateNeedsInferredDay() -- the original fixture's date fields all carry
     an explicit "MM/DD/YYYY" placeholder, which satisfies the earlier
     generic hint check before ever reaching the ats.key==="successfactors"
     branch, so that branch was never actually being tested. This field
     has no placeholder/hint at all, so it can only get MM/DD/YYYY-formatted
     if the vanity-domain fingerprint resolved correctly.
-->
<img src="https://rmkcdn.successfactors.com/fake-asset.png" style="display:none" alt="">
<h1>SuccessFactors vanity-domain fingerprint fixture</h1>
<div id="workHdr" class="hdr" onclick="toggle('workBody')">Work Experience</div>
<div id="workBody" class="body hidden"><button id="addWork">Add</button><div id="workRows"></div></div>
<div id="langHdr" class="hdr" onclick="toggle('langBody')">Language Skills</div>
<div id="langBody" class="body hidden"><p id="langEmpty">There are no items in this section.</p><button id="addLang">Add</button><div id="langRows"></div></div>
<script>
function toggle(id){document.getElementById(id).classList.toggle('hidden')}
function inp(label,id,ph){const l=document.createElement('label');l.textContent=label+' ';const i=document.createElement('input');i.id=id;i.name=id;i.setAttribute('data-field-id',id);if(ph)i.placeholder=ph;l.appendChild(i);return l}
function sel(label,id,opts){const l=document.createElement('label');l.textContent=label+' ';const s=document.createElement('select');s.id=id;s.name=id;s.setAttribute('data-field-id',id);s.innerHTML='<option>No Selection</option>'+opts.map(x=>'<option>'+x+'</option>').join('');l.appendChild(s);return l}
addWork.onclick=()=>{addWork.remove();const r=document.createElement('div');r.id='outsideWorkExperience_1';r.append(inp('Employer','outsideWorkExperience_1_employer'));r.append(inp('Job Title','outsideWorkExperience_1_startTitle'));r.append(inp('Start Date','outsideWorkExperience_1_startDate'));r.append(inp('End Date','outsideWorkExperience_1_endDate'));workRows.append(r)};
addLang.onclick=()=>{addLang.remove();langEmpty.remove();const r=document.createElement('div');r.id='languageSkills_1';r.append(sel('Language','languageSkills_1_language',['English','Arabic','Urdu']));r.append(sel('Speaking Proficiency','languageSkills_1_speakingProf',['Native','Fluent','Conversational']));langRows.append(r)};
window.chrome={runtime:{onMessage:{addListener:function(fn){window.gfListener=fn}},sendMessage:function(){return Promise.resolve({ok:true})}}};
</script>
<script src="rules.js"></script><script src="content.js"></script>
<script>
const profile={personal:{firstName:'Test',lastName:'User',email:'t@example.com',country:'Australia'},eligibility:{},education:[],experience:[{employer:'Gridware',title:'Cyber Security Intern',startDate:'2025-02',endDate:'2025-06',current:false,location:'Sydney, NSW',country:'Australia',description:''}],languages:[{language:'English',spoken:'Native',written:'Native',reading:'Native'},{language:'Urdu',spoken:'Fluent',written:'Fluent',reading:'Fluent'}],skills:[],preferences:{},tags:{industries:{items:[]},programs:{items:[]},leadership:{items:[]},extracurricular:{items:[]}},custom:[],fieldMemory:[],answerLibrary:[]};
setTimeout(()=>{
  const resolvedATS = (typeof GF!=='undefined' && GF.resolveATS) ? GF.resolveATS() : {key:'error'};
  document.body.setAttribute('data-resolved-ats', JSON.stringify(resolvedATS));
  gfListener({type:'GF_FILL',profile,roleContext:{}},{},function(res){
    document.body.setAttribute('data-done','yes');
    document.body.setAttribute('data-report',JSON.stringify(res.report||[]));
    document.body.setAttribute('data-start-date-value', document.getElementById('outsideWorkExperience_1_startDate') ? document.getElementById('outsideWorkExperience_1_startDate').value : '(field not found)');
    document.body.setAttribute('data-lang-1-value', document.getElementById('languageSkills_1_language') ? document.getElementById('languageSkills_1_language').value : '(field not found)');
  });
},50);
</script>
</body></html>
