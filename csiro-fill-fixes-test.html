<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial;margin:20px}.hdr{padding:18px;background:#9aacC5}label{display:inline-block;width:30%;margin:8px}input{width:30%;padding:6px}
</style></head><body>
<!--
  Proves three fixes together against CSIRO's real captured DOM shapes
  (all ids/names/roles copied from devtools against the real live page,
  not guessed):

  (1) Phone Home/Work must no longer silently green-inherit Mobile with
      no warning. Real ids: cellPhone/homePhone/workPhone.

  (2) A role="combobox" picker whose real option list never renders (the
      exact live failure mode confirmed on CSIRO's Qualification Type
      field -- fillAccessibleCombo() times out without ever finding a
      rendered [role="option"]) must report "prompt" (blank, honest), not
      "check" (implying something was picked). id="283:_input", matching
      the real captured shape exactly -- deliberately NO option-list markup
      anywhere in this fixture, so the poll genuinely finds nothing, same
      as the live page.

  (3) "Education" as a plain, non-semantic <div> heading (CSIRO's real
      shape -- confirmed caught only by collectMarkers()'s SECOND pass,
      never the semantic-heading pass) followed later by "Relocation" as
      a real <b> heading, then a "relocating from" text field: without
      sorted markers, "relocating from" previously inherited the
      Education block (via the block's bare "from" rule) and got a
      formatted date. With the fix it must fall through unmatched
      instead.
-->
<label for="90:_txtFld">* Phone Number - Mobile</label><input id="90:_txtFld" name="cellPhone">
<label for="94:_txtFld">Phone Number - Home</label><input id="94:_txtFld" name="homePhone">
<label for="98:_txtFld">Phone Number - Work</label><input id="98:_txtFld" name="workPhone">

<div class="hdr">Education</div>
<label for="283:_input">Qualification Type</label>
<input id="283:_input" aria-label="Qualification Type" autocomplete="off" type="text" placeholder="No Selection" title="Qualification Type" role="combobox">

<b>Relocation</b>
<label for="247:_input">I would be relocating from:</label>
<input id="247:_input" aria-label="I would be relocating from:" type="text" placeholder="No Selection">

<div class="attachWrapper">
  <div id="56:_attach" class="attachmentBtn"><div id="56:_attachDownloadLabel" role="button" class="attachmentLabel attachmentText">Upload a CV</div></div>
</div>
<div class="attachWrapper">
  <div id="58:_attach" class="attachmentBtn"><div id="58:_attachDownloadLabel" role="button" class="attachmentLabel attachmentText">Attach a Cover Letter</div></div>
</div>

<script>
window.chrome={runtime:{onMessage:{addListener:function(fn){window.gfListener=fn}},sendMessage:function(){return Promise.resolve({ok:true})}}};
</script>
<script src="rules.js"></script><script src="content.js"></script>
<script>
const profile={
  personal:{firstName:'Test',lastName:'User',email:'t@example.com',phone:'0412345678',phoneType:'Mobile',country:'Australia'},
  eligibility:{},
  education:[{institution:'UTS',degree:'Bachelor of Cybersecurity',major:'Cybersecurity',levelLabel:'Bachelor Degree',startDate:'2023-02',expectedGraduation:'2026-11',completed:false}],
  experience:[],
  languages:[], skills:[], preferences:{}, tags:{industries:{items:[]},programs:{items:[]},leadership:{items:[]},extracurricular:{items:[]}},
  custom:[], fieldMemory:[], answerLibrary:[]
};
setTimeout(()=>{
  gfListener({type:'GF_FILL',profile,roleContext:{}},{},function(res){
    document.body.setAttribute('data-done','yes');
    document.body.setAttribute('data-report',JSON.stringify(res.report||[]));
    document.body.setAttribute('data-mobile-value', document.getElementById('90:_txtFld').value);
    document.body.setAttribute('data-home-value', document.getElementById('94:_txtFld').value);
    document.body.setAttribute('data-work-value', document.getElementById('98:_txtFld').value);
    document.body.setAttribute('data-qualtype-value', document.getElementById('283:_input').value);
    document.body.setAttribute('data-relocating-from-value', document.getElementById('247:_input').value);
  });
},3200);
</script>
</body></html>
