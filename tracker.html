<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GradFill AI — Job Tracker</title><link rel="stylesheet" href="tracker.css">
</head>
<body>
<header class="topbar">
  <div><p class="eyebrow">GradFill AI</p><h1>Job Tracker</h1><p class="sub">Your saved roles, applications, resume versions, notes and next steps in one place.</p></div>
  <div class="top-actions"><span class="plan" id="planBadge">Free</span><button class="ghost" id="syncBtn">Sync</button><button class="ghost" id="exportBtn">Export CSV</button><button class="primary" id="addBtn">+ Add role</button></div>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search company, role, skill or note">
    <select id="statusFilter"><option value="">All stages</option></select>
    <span class="count" id="count"></span>
  </div>
  <div class="board" id="board"></div>
</main>
<dialog id="editor">
  <form method="dialog" id="editForm">
    <div class="dialog-head"><div><p class="eyebrow">Tracker entry</p><h2 id="editTitle">Role</h2></div><button class="x" value="cancel" aria-label="Close">×</button></div>
    <input type="hidden" id="jobId">
    <div class="grid">
      <label>Status<select id="jobStatus"></select></label>
      <label>Company<input id="jobCompany"></label>
      <label>Role<input id="jobRole"></label>
      <label>Location<input id="jobLocation"></label>
      <label>Employment type<input id="jobType"></label>
      <label>Applications close<input id="jobCloses"></label>
      <label>Date applied<input id="jobApplied" type="month"></label>
      <label>Found via<input id="jobSource"></label>
      <label class="wide">Job/application link<input id="jobLink" type="url"></label>
      <label class="wide">Matched / key skills<textarea id="jobSkills" rows="3"></textarea></label>
      <label class="wide">Resume used<input id="jobResume"></label>
      <label class="wide">Notes<textarea id="jobNotes" rows="4"></textarea></label>
      <label class="wide">Job description snapshot<textarea id="jobDescription" rows="7"></textarea></label>
    </div>
    <div class="dialog-actions"><button type="button" class="danger ghost" id="deleteBtn">Delete</button><span class="spacer"></span><button type="button" class="ghost" id="tailorBtn">Tailor resume</button><button type="submit" class="primary" value="save">Save</button></div>
  </form>
</dialog>
<div class="toast" id="toast" hidden></div>
<script src="cloud.js"></script><script src="tracker.js"></script>
</body></html>
