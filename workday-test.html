<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial;margin:20px}label{display:inline-block;width:30%;margin:8px}input{width:30%;padding:6px}
</style></head><body>
<!--
  Proves a real honeypot miss found live this session on Telstra's real
  Workday "Create Account" step (the first screen of Apply Manually, no
  account existed, nothing was submitted):

    <input id="...(guid)..." name="website" type="text"> sized 1px by
    ~0.01px via CSS (NOT exactly 0x0 -- getBoundingClientRect() returned
    width:1, height:0.010009765625), paired with a real <label> reading
    verbatim "Enter website. This input is for robots only, do not enter
    if you're human." Neither aria-hidden nor tabindex="-1" is present --
    it's hidden purely by near-zero size, a different bot-trap convention
    from the aria-hidden one already covered by the Oracle fixture.

  Before this fixture's fix, collect()'s size filter required an EXACT
  0x0 rect (r.width === 0 && r.height === 0), so a 1 x 0.01 field slipped
  straight through -- and its label text ("website") would have scored a
  real match against GF.RULES' "portfolio" rule (which matches the word
  "website"), meaning GradFill would have confidently typed the user's
  real portfolio URL into a bot trap. This fixture reproduces the exact
  field shape (id, name, size, label wording) to prove the fix: the field
  must end up untouched and never named in the fill report.

  Also present: the real Email Address / Password / Verify New Password /
  consent-checkbox fields from the same live screen, to confirm ordinary
  filling still works right alongside the fix (email filled, both
  passwords left alone as NEVER_FILL_RE sensitive fields, consent
  checkbox left unticked as a NEVER_TICK_RE declaration).
-->
<h1>Workday fixture (Telstra Create Account step)</h1>
<label>Email Address <input id="input-4" type="text" autocomplete="email"></label>
<label>Password <input id="input-5" type="password" autocomplete="new-password"></label>
<label>Verify New Password <input id="input-6" type="password" autocomplete="new-password"></label>
<label>Yes, I have read and consent to the terms and conditions <input id="input-9" type="checkbox"></label>
<label for="honeypot-website">Enter website. This input is for robots only, do not enter if you're human.</label>
<input id="honeypot-website" name="website" type="text" style="width:1px;height:0.01px;overflow:hidden;border:0;padding:0">
<script>
window.chrome={runtime:{onMessage:{addListener:function(fn){window.gfListener=fn}},sendMessage:function(){return Promise.resolve({ok:true})}}};
</script>
<script src="rules.js"></script><script src="content.js"></script>
<script>
const profile={personal:{firstName:'Test',lastName:'User',email:'t@example.com',country:'Australia',portfolio:'https://myportfolio.example.com'},eligibility:{},education:[],experience:[],languages:[],skills:[],preferences:{},tags:{industries:{items:[]},programs:{items:[]},leadership:{items:[]},extracurricular:{items:[]}},custom:[],fieldMemory:[],answerLibrary:[]};
setTimeout(()=>{
  const resolvedATS = (typeof GF!=='undefined' && GF.resolveATS) ? GF.resolveATS() : {key:'error'};
  document.body.setAttribute('data-resolved-ats', JSON.stringify(resolvedATS));
  gfListener({type:'GF_FILL',profile,roleContext:{}},{},function(res){
    document.body.setAttribute('data-done','yes');
    document.body.setAttribute('data-report',JSON.stringify(res.report||[]));
    document.body.setAttribute('data-honeypot-value', document.getElementById('honeypot-website').value);
    document.body.setAttribute('data-honeypot-in-report', String((res.report||[]).some(r => /honeypot|website/i.test(JSON.stringify(r)))));
    document.body.setAttribute('data-email-value', document.getElementById('input-4').value);
    document.body.setAttribute('data-password-value', document.getElementById('input-5').value);
    document.body.setAttribute('data-consent-checked', String(document.getElementById('input-9').checked));
  });
},50);
</script>
</body></html>
