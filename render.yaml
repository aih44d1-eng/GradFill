databases:
  - name: gradfill-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: gradfill-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gradfill-db
          property: connectionString
      - key: NODE_ENV
        value: production
