services:
  - type: web
    name: gradfill-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Points at the existing Supabase Postgres instance, not a
      # Render-managed database -- that decision (and the connection
      # string itself) was made outside this file. sync: false means
      # Render will prompt for the real value in its dashboard at
      # deploy time rather than expecting it committed here.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
