<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:Arial;margin:20px}label{display:inline-block;width:30%;margin:8px}input{width:30%;padding:6px}
</style></head><body>
<!--
  Proves GF.resolveATS()'s Avature fingerprint fallback, confirmed live
  this session against two real, unrelated Avature customer instances:

    - https://recruitment.macquarie.com (Macquarie Group)
    - https://jobs.siemens.com (Siemens)

  Neither carries an avature.net hostname anywhere in the URL bar (both
  are proxied behind the customer's own vanity domain, exactly like the
  SuccessFactors/Oracle vanity cases already covered) -- the one resource
  host common to both, confirmed by inspecting each page's live
  script/link tags in the browser, is templates-static-assets.avacdn.net,
  serving Avature's shared template CSS/JS bundle. This fixture is served
  from a plain 127.0.0.1 origin (no avature.net hostname at all) and
  carries only that one DOM marker, to prove the fingerprint fallback
  alone -- not the static host list -- is what resolves it.

  Also reached (both instances) but deliberately NOT modelled here: the
  real login/registration wall stops both platforms at the exact same
  point Workday, SuccessFactors and Oracle did before a real account
  existed --

    Macquarie (recruitment.macquarie.com/en_US/careers/ApplicationMethods):
      "Choose your application method" -- left column "Apply using your
      existing account" (Email address + Password + Login), right column
      "Create a new account to apply by submitting your resume or
      applying with Seek" (Upload from device).

    Siemens (jobs.siemens.com/en_US/externaljobs/ApplicationMethods):
      Same shape, different wording/skin -- "Already registered?"
      (Email + Password + Log in, plus "Log in with a code") on the left,
      "Create an account using any of the following options: Upload file
      / Self-complete" on the right. Both sit behind a 5-step wizard
      (Login/Registration, Profile information, Global/Country questions,
      Job-specific questions) that never rendered without an account.

  The Email/Password fields below stand in for that real gate, to prove
  content.js's NEVER_FILL_RE still leaves a password field alone on this
  platform (nothing Avature-specific was needed for that -- the existing
  generic rule already covers it -- but worth confirming rather than
  assuming).
-->
<script src="https://templates-static-assets.avacdn.net/jsLibrary/22.4/core.min.js" onerror="void 0"></script>
<h1>Avature fixture (Macquarie/Siemens shared template fingerprint)</h1>
<label>Email address <input id="email-0" name="email" type="email" autocomplete="email"></label>
<label>Password <input id="password-0" name="password" type="password"></label>
<script>
window.chrome={runtime:{onMessage:{addListener:function(fn){window.gfListener=fn}},sendMessage:function(){return Promise.resolve({ok:true})}}};
</script>
<script src="rules.js"></script><script src="content.js"></script>
<script>
const profile={personal:{firstName:'Test',lastName:'User',email:'t@example.com',country:'Australia'},eligibility:{},education:[],experience:[],languages:[],skills:[],preferences:{},tags:{industries:{items:[]},programs:{items:[]},leadership:{items:[]},extracurricular:{items:[]}},custom:[],fieldMemory:[],answerLibrary:[]};
setTimeout(()=>{
  const resolvedATS = (typeof GF!=='undefined' && GF.resolveATS) ? GF.resolveATS() : {key:'error'};
  document.body.setAttribute('data-resolved-ats', JSON.stringify(resolvedATS));
  gfListener({type:'GF_FILL',profile,roleContext:{}},{},function(res){
    document.body.setAttribute('data-done','yes');
    document.body.setAttribute('data-report',JSON.stringify(res.report||[]));
    document.body.setAttribute('data-password-value', document.getElementById('password-0').value);
  });
},50);
</script>
</body></html>
